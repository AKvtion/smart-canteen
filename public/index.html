<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧食堂管理系统</title><style>
:root{--bg:#f6f8fc;--card:#ffffffcc;--text:#172033;--muted:#72809a;--line:#e7ecf5;--primary:#4f7cff;--primary2:#6ee7b7;--danger:#ef4444;--warn:#f59e0b;--ok:#10b981;--side:#101827;--shadow:0 18px 45px rgba(20,32,60,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at top left,#dbeafe,transparent 32%),radial-gradient(circle at top right,#dcfce7,transparent 28%),var(--bg);color:var(--text)}input,select,button{font:inherit}input,select{height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,124,255,.12)}button{height:40px;border:0;border-radius:12px;padding:0 14px;background:linear-gradient(135deg,var(--primary),#7c5cff);color:white;cursor:pointer;font-weight:650;box-shadow:0 8px 22px rgba(79,124,255,.22)}button:hover{transform:translateY(-1px)}button.ghost{background:#eef3ff;color:#365bd8;box-shadow:none}button.danger{background:linear-gradient(135deg,#ef4444,#fb7185)}button.flat{background:#fff;color:#334155;border:1px solid var(--line);box-shadow:none}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,92vw);background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:30px;box-shadow:var(--shadow)}.login-card h1{margin:0 0 8px;font-size:28px}.login-card p{color:var(--muted)}.login-card input,.login-card button{width:100%;margin-top:12px}.app{display:none}.layout{display:flex;min-height:100vh}.side{position:fixed;inset:16px auto 16px 16px;width:236px;background:linear-gradient(180deg,#111827,#0b1020);border-radius:24px;padding:18px 12px;color:#fff;box-shadow:0 24px 60px rgba(2,6,23,.28)}.brand{font-size:21px;font-weight:850;padding:8px 10px 18px}.side button{display:flex;align-items:center;width:100%;height:44px;margin:5px 0;padding:0 14px;background:transparent;color:#aeb9cf;box-shadow:none;text-align:left;justify-content:flex-start}.side button.active,.side button:hover{background:rgba(255,255,255,.11);color:white;transform:none}.main{margin-left:268px;flex:1;min-width:0}.top{height:74px;margin:16px 16px 0 0;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow)}#pageTitle{font-size:20px}.content{padding:18px 16px 28px 0}.panel{display:none}.panel.active{display:block}.card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.card h2{margin:0 0 16px}.card h3{margin:18px 0 12px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}.w120{width:120px}.w160{width:160px}.w190{width:190px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}.stat{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid #fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.stat:after{content:"";position:absolute;right:-20px;top:-20px;width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,rgba(79,124,255,.18),rgba(110,231,183,.18))}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:30px;font-weight:850;margin-top:5px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:white}table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;white-space:nowrap}th{background:#f8fafc;color:#64748b;font-weight:750}tr:last-child td{border-bottom:0}.tag{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.tag.ok{background:#dcfce7;color:#047857}.tag.bad{background:#fee2e2;color:#b91c1c}.tag.wait{background:#fef3c7;color:#b45309}.verify-result{font-size:24px;font-weight:850;padding:22px;border-radius:22px;background:linear-gradient(135deg,#eef6ff,#f0fdf4);border:1px solid #dbeafe}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:white;padding:13px 18px;border-radius:14px;display:none;z-index:20;box-shadow:0 16px 40px #0003}.hint{color:var(--muted);font-size:13px}.hero{display:flex;gap:14px;align-items:center;margin-bottom:16px}.hero-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#4f7cff,#6ee7b7);font-size:28px;color:#fff}@media(max-width:900px){.side{position:static;width:auto;margin:12px;border-radius:22px}.layout{display:block}.main{margin-left:0}.top{margin:12px}.content{padding:0 12px 20px}.side button{display:inline-flex;width:auto}.toolbar input,.toolbar select{width:100%}}
</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="hero"><div class="hero-icon">🍱</div><div><h1>智慧食堂</h1><p>订餐、充值、刷卡/人脸核销一体化</p></div></div><input id="loginUser" value="admin" placeholder="管理员账号"><input id="loginPass" type="password" value="admin123" placeholder="密码"><button onclick="login()">登录系统</button><p class="hint">测试账号：admin / admin123</p></div></div><div id="appView" class="app"><div class="layout"><aside class="side"><div class="brand">🍱 Smart Canteen</div><button class="active" onclick="show('dashboard',this)">首页统计</button><button onclick="show('deptPanel',this)">部门管理</button><button onclick="show('employeePanel',this)">员工管理</button><button onclick="show('menuPanel',this)">菜单餐次</button><button onclick="show('orderPanel',this)">订餐管理</button><button onclick="show('balancePanel',this)">充值余额</button><button onclick="show('verifyPanel',this)">饭堂核销</button><button onclick="show('logPanel',this)">日志模块</button></aside><main class="main"><div class="top"><div><b id="pageTitle">首页统计</b><div class="hint">内网试点版 · MVP</div></div><span><span id="adminName"></span> <button class="ghost" onclick="logout()">退出</button></span></div><div class="content"><section id="dashboard" class="panel active"><div class="card"><div class="toolbar"><input id="reportStart" class="w190" type="date"><input id="reportEnd" class="w190" type="date"><button onclick="loadReport()">统计</button><button class="flat" onclick="setTodayReport()">今天</button></div><div class="stats"><div class="stat"><div class="label">订餐人数</div><div id="statOrdered" class="num">0</div></div><div class="stat"><div class="label">已取餐</div><div id="statConsumed" class="num">0</div></div><div class="stat"><div class="label">未取餐</div><div id="statNot" class="num">0</div></div><div class="stat"><div class="label">消费金额</div><div id="statAmount" class="num">¥0</div></div></div><div id="rangeStats"></div></div></section><section id="deptPanel" class="panel"><div class="card"><h2>部门管理</h2><div class="toolbar"><input id="deptName" class="w190" placeholder="部门名称"><button onclick="addDepartment()">新增部门</button><select id="deptView" class="w190" onchange="loadDepartmentEmployees()"></select></div><h3>部门员工</h3><div id="deptEmployees"></div><h3>部门列表</h3><div id="departments"></div></div></section><section id="employeePanel" class="panel"><div class="card"><h2>员工管理</h2><div class="toolbar"><input id="empQuery" class="w190" placeholder="姓名/工号/手机号/卡号"><select id="empFilterDept" class="w190"></select><button class="flat" onclick="loadEmployees()">查询</button></div><div class="toolbar"><input id="empName" class="w120" placeholder="姓名"><input id="empJob" class="w120" placeholder="工号"><select id="empDept" class="w120"></select><input id="empPhone" class="w160" placeholder="手机号"><input id="empCard" class="w120" placeholder="饭卡号"><input id="empFace" class="w120" placeholder="人脸码"><button onclick="addEmployee()">新增员工</button></div><div id="employees"></div></div></section><section id="menuPanel" class="panel"><div class="card"><h2>菜单/餐次管理</h2><div class="toolbar"><input id="menuDate" class="w190" type="date"><select id="mealType" class="w120"><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option></select><input id="itemName" class="w190" placeholder="菜品/套餐"><input id="price" class="w120" type="number" placeholder="价格"><input id="deadline" class="w190" type="datetime-local"><button onclick="addMenu()">发布单日菜单</button></div><div class="toolbar"><input id="batchStart" class="w190" type="date"><input id="batchEnd" class="w190" type="date"><button class="flat" onclick="batchMenus(7)">生成未来7天</button><button class="flat" onclick="batchMenus(14)">生成未来14天</button></div><div id="menus"></div></div></section><section id="orderPanel" class="panel"><div class="card"><h2>订餐管理</h2><div class="toolbar"><input id="orderDate" class="w190" type="date"><button class="flat" onclick="loadOrders()">查询日期</button><select id="orderEmployee" class="w190"></select><select id="orderMenu" class="w190"></select><button onclick="createOrder()">代订餐</button></div><div id="orders"></div></div></section><section id="balancePanel" class="panel"><div class="card"><h2>充值/余额</h2><p class="hint">单次最低 10 元；每名员工每天最多充值 1000 元。</p><div class="toolbar"><select id="rechargeEmployee" class="w190"></select><input id="rechargeAmount" class="w120" type="number" placeholder="充值金额"><input id="rechargeRemark" class="w190" placeholder="备注"><button onclick="recharge()">充值</button></div><div id="balanceEmployees"></div></div></section><section id="verifyPanel" class="panel"><div class="card"><h2>饭堂核销</h2><div class="toolbar"><select id="verifyMethod" class="w120"><option value="card">刷卡</option><option value="face">人脸</option></select><select id="verifyMeal" class="w120"><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option></select><input id="verifyCode" class="w190" style="font-size:20px" placeholder="饭卡号/人脸码"><button onclick="verify()">核销扣款</button></div><div id="verifyResult" class="verify-result">等待核销</div></div></section><section id="logPanel" class="panel"><div class="card"><h2>日志模块</h2><div class="toolbar"><button class="flat" onclick="download('/api/export/audit-logs')">导出操作日志</button><button class="flat" onclick="download('/api/export/balance-logs')">导出余额流水</button><button class="flat" onclick="download('/api/export/verify-logs')">导出核销日志</button></div><h3>操作日志</h3><div id="auditLogs"></div><h3>余额流水</h3><div id="balanceLogs"></div><h3>核销日志</h3><div id="verifyLogs"></div></div></section></div></main></div></div><div id="toast" class="toast"></div><script>const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);let token=localStorage.getItem('canteen_token')||'',deptList=[];for(const id of ['menuDate','orderDate','batchStart','batchEnd','reportStart','reportEnd'])$(id).value=today;deadline.value=today+'T23:59';function toast(m){$('toast').innerHTML=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}async function api(u,o={}){const h={'Content-Type':'application/json',...(o.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(u,{...o,headers:h});const j=await r.json().catch(()=>({success:false,message:'请求失败'}));if(!j.success){if(r.status===401){token='';localStorage.removeItem('canteen_token');showLogin()}throw new Error(j.message)}return j}function meal(v){return{breakfast:'早餐',lunch:'午餐',dinner:'晚餐'}[v]||v}function st(s){return{active:'启用',disabled:'禁用',enabled:'启用',ordered:'已订餐',consumed:'已取餐',cancelled:'已取消'}[s]||s}function tag(s){let cls={active:'ok',enabled:'ok',disabled:'bad',cancelled:'bad',ordered:'wait',consumed:'ok'}[s]||'wait';return`<span class="tag ${cls}">${st(s)}</span>`}function table(el,heads,rows){$(el).innerHTML=`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function showLogin(){loginView.style.display='grid';appView.style.display='none'}function showApp(){loginView.style.display='block';loginView.style.display='none';appView.style.display='block'}async function login(){try{let r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:loginUser.value,password:loginPass.value})});token=r.token;localStorage.setItem('canteen_token',token);adminName.textContent=r.admin.name;showApp();refresh()}catch(e){toast(e.message)}}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}token='';localStorage.removeItem('canteen_token');showLogin()}async function boot(){if(!token)return showLogin();try{let r=await api('/api/auth/me');adminName.textContent=r.admin.name;showApp();refresh()}catch{showLogin()}}function show(id,b){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pageTitle.textContent=b.textContent}async function refresh(){await loadDepartments();await loadEmployees();await loadMenus();await loadOrders();await loadLogs();await loadReport()}async function loadDepartments(){let r=await api('/api/departments');deptList=r.departments;table('departments',['ID','部门','状态'],deptList.map(d=>[d.id,d.name,tag(d.status)]));for(const id of ['empDept','deptView'])$(id).innerHTML=deptList.map(d=>`<option>${d.name}</option>`).join('');empFilterDept.innerHTML='<option value="">全部部门</option>'+deptList.map(d=>`<option>${d.name}</option>`).join('');loadDepartmentEmployees()}async function addDepartment(){try{await api('/api/departments',{method:'POST',body:JSON.stringify({name:deptName.value})});deptName.value='';refresh()}catch(e){toast(e.message)}}async function loadDepartmentEmployees(){let dep=deptView.value;if(!dep)return;let r=await api('/api/employees?department='+encodeURIComponent(dep));table('deptEmployees',['姓名','工号','手机号','饭卡','余额','状态'],r.employees.map(e=>[e.name,e.jobNo,e.phone||'',e.cardNo||'',`¥${Number(e.balance).toFixed(2)}`,tag(e.status)]))}async function loadEmployees(){let q=empQuery.value||'',dep=empFilterDept.value||'';let r=await api('/api/employees?q='+encodeURIComponent(q)+'&department='+encodeURIComponent(dep));let emps=r.employees;table('employees',['ID','姓名','工号','部门','手机号','饭卡','余额','状态','操作'],emps.map(e=>[e.id,e.name,e.jobNo,e.department||'',e.phone||'',e.cardNo||'',`¥${Number(e.balance).toFixed(2)}`,tag(e.status),`<button class="flat" onclick="setEmployeeStatus(${e.id},'${e.status==='active'?'disabled':'active'}')">${e.status==='active'?'禁用':'启用'}</button> <button class="danger" onclick="deleteEmployee(${e.id})">删除</button>`]));balanceEmployeesTable(emps);for(const id of ['orderEmployee','rechargeEmployee'])$(id).innerHTML=emps.filter(e=>e.status==='active').map(e=>`<option value="${e.id}">${e.name}(${e.jobNo})</option>`).join('')}function balanceEmployeesTable(emps){table('balanceEmployees',['员工','工号','部门','余额','饭卡'],emps.map(e=>[e.name,e.jobNo,e.department||'',`¥${Number(e.balance).toFixed(2)}`,e.cardNo||'']))}async function addEmployee(){try{await api('/api/employees',{method:'POST',body:JSON.stringify({name:empName.value,jobNo:empJob.value,department:empDept.value,phone:empPhone.value,cardNo:empCard.value,faceCode:empFace.value})});refresh()}catch(e){toast(e.message)}}async function setEmployeeStatus(id,status){try{await api('/api/employees/'+id+'/status',{method:'POST',body:JSON.stringify({status})});refresh()}catch(e){toast(e.message)}}async function deleteEmployee(id){if(confirm('确定删除？有余额则只能禁用。'))try{await api('/api/employees/'+id,{method:'DELETE'});refresh()}catch(e){toast(e.message)}}async function loadMenus(){let r=await api('/api/menus?date='+menuDate.value);let menus=r.menus;table('menus',['ID','日期','餐次','菜品','价格','截止','状态','操作'],menus.map(m=>[m.id,m.mealDate,meal(m.mealType),m.itemName,`¥${m.price}`,m.deadline.replace('T',' '),tag(m.status),`<button class="flat" onclick="setMenuStatus(${m.id},'${m.status==='enabled'?'disabled':'enabled'}')">${m.status==='enabled'?'停用':'启用'}</button>`]));orderMenu.innerHTML=menus.filter(m=>m.status==='enabled').map(m=>`<option value="${m.id}">${meal(m.mealType)}-${m.itemName}-¥${m.price}</option>`).join('')}menuDate.onchange=loadMenus;async function addMenu(){try{await api('/api/menus',{method:'POST',body:JSON.stringify({mealDate:menuDate.value,mealType:mealType.value,itemName:itemName.value,price:price.value,deadline:deadline.value})});refresh()}catch(e){toast(e.message)}}async function setMenuStatus(id,status){try{await api('/api/menus/'+id+'/status',{method:'POST',body:JSON.stringify({status})});refresh()}catch(e){toast(e.message)}}async function batchMenus(days){let s=new Date(batchStart.value),e=new Date(s);e.setDate(s.getDate()+days-1);batchEnd.value=e.toISOString().slice(0,10);try{await api('/api/menus/batch',{method:'POST',body:JSON.stringify({startDate:batchStart.value,endDate:batchEnd.value,items:[{mealType:'breakfast',itemName:'早餐套餐',price:5,deadlineTime:'08:30'},{mealType:'lunch',itemName:'午餐套餐',price:12,deadlineTime:'10:30'},{mealType:'dinner',itemName:'晚餐套餐',price:10,deadlineTime:'16:30'}]})});refresh()}catch(e){toast(e.message)}}async function createOrder(){try{await api('/api/orders',{method:'POST',body:JSON.stringify({employeeId:orderEmployee.value,menuId:orderMenu.value})});refresh()}catch(e){toast(e.message)}}async function cancelOrder(id){try{await api('/api/orders/'+id+'/cancel',{method:'POST'});refresh()}catch(e){toast(e.message)}}async function loadOrders(){let r=await api('/api/orders?date='+orderDate.value);table('orders',['ID','员工','部门','餐次','菜品','金额','状态','操作'],r.orders.map(o=>[o.id,o.employee?.name||o.employeeId,o.employee?.department||'',meal(o.mealType),o.menu?.itemName||'',`¥${o.price}`,tag(o.status),o.status==='ordered'?`<button class="danger" onclick="cancelOrder(${o.id})">取消</button>`:'']))}async function recharge(){try{await api('/api/recharge',{method:'POST',body:JSON.stringify({employeeId:rechargeEmployee.value,amount:rechargeAmount.value,remark:rechargeRemark.value})});refresh()}catch(e){toast(e.message)}}async function verify(){try{let body={method:verifyMethod.value,mealType:verifyMeal.value,deviceId:'canteen-web-01'};if(body.method==='card')body.cardNo=verifyCode.value.trim();else body.faceCode=verifyCode.value.trim();let r=await api('/api/canteen/verify',{method:'POST',body:JSON.stringify(body)});verifyResult.innerHTML=`${r.employeeName} 核销成功，扣款 ¥${r.amount}，余额 ¥${r.balance}`;verifyCode.value='';refresh()}catch(e){verifyResult.innerHTML=e.message}}verifyCode.onkeydown=e=>{if(e.key==='Enter')verify()};function setTodayReport(){reportStart.value=today;reportEnd.value=today;loadReport()}async function loadReport(){let r=await api('/api/reports/range?start='+reportStart.value+'&end='+reportEnd.value);statOrdered.textContent=r.total.orderedCount;statConsumed.textContent=r.total.consumedCount;statNot.textContent=r.total.notConsumedCount;statAmount.textContent='¥'+r.total.totalAmount;table('rangeStats',['日期','订餐','已取餐','未取餐','金额'],r.rows.map(x=>[x.date,x.orderedCount,x.consumedCount,x.notConsumedCount,`¥${x.totalAmount}`]))}function download(path){window.open(path+'?token='+encodeURIComponent(token),'_blank')}async function loadLogs(){let [b,v,a]=await Promise.all([api('/api/balance-logs'),api('/api/verify-logs'),api('/api/audit-logs')]);table('auditLogs',['时间','操作','详情','操作人'],a.logs.slice(-50).reverse().map(l=>[l.createdAt.slice(0,19).replace('T',' '),l.action,l.detail,l.operator]));table('balanceLogs',['时间','员工ID','类型','金额','前','后','备注'],b.logs.slice(-30).reverse().map(l=>[l.createdAt.slice(0,19).replace('T',' '),l.employeeId,l.type,l.amount,l.beforeBalance,l.afterBalance,l.remark||'']));table('verifyLogs',['时间','员工ID','方式','结果','消息','设备'],v.logs.slice(-30).reverse().map(l=>[l.createdAt.slice(0,19).replace('T',' '),l.employeeId||'',l.verifyMethod,l.result,l.message,l.deviceId||'']))}boot();</script></body></html>
